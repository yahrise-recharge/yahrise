<title>Yah'Rise Commande</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
/* Layout: one centred column, a card per recharge line, gold on the logo's own charcoal. */
:root{--bg:#231f20;--surface:#2d2829;--surface2:#383233;--line:#4a4243;--text:#f6f1e7;--muted:#a99f94;--gold:#f7c61f;--gold-ink:#231f20;--ok:#63d39a;--bad:#f0685d;--orange:#ff7a1a;--mtn:#ffd400;--moov:#3c8dde;--display:'Marcellus',Georgia,serif;--ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--ui);padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.brand img{width:170px;height:auto;display:block}
h1{font:400 28px/1.15 var(--display);margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font:400 20px/1.2 var(--display);margin:0;color:var(--gold)}
label,.lab{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],input[type=number]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;font-size:17px;min-width:0}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font:600 15px var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.chip[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.line{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px}
.line header{display:flex;justify-content:space-between;align-items:center}
.line header b{font:400 17px var(--display);color:var(--gold)}
.link{background:none;border:0;color:var(--muted);font:600 14px var(--ui);cursor:pointer;text-decoration:underline;padding:6px}
.btn{border:0;border-radius:12px;padding:15px 18px;font:700 17px var(--ui);cursor:pointer;background:var(--gold);color:var(--gold-ink);min-height:50px;text-align:center;text-decoration:none;display:block;width:100%}
.btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.add{background:transparent;border:1.5px dashed var(--line);color:var(--text);border-radius:12px;padding:14px;font:600 16px var(--ui);cursor:pointer;width:100%}
.err{color:var(--bad);font-size:14px;margin:6px 0 0}
.sum{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-variant-numeric:tabular-nums}
.sum .m{color:var(--muted);font-size:14px}
.sum .r{text-align:right;font-weight:600;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px;font-variant-numeric:tabular-nums}
.total b{font:400 28px var(--display);color:var(--gold)}
.check{text-transform:none;letter-spacing:0;font-weight:400;color:var(--text);margin:0;display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:24px;height:24px;margin:0;accent-color:var(--gold);flex:none}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font:700 14px/28px var(--ui);text-align:center}
.ref{font:400 34px var(--display);color:var(--gold);letter-spacing:.06em;text-align:center}
.ok{color:var(--ok)}
.fine{font-size:13px;color:var(--muted);text-align:center;margin:0}
textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.4 ui-monospace,Menlo,monospace;min-height:130px}
</style>

var S = {name:'', via:'whatsapp', contact:'', lines:[blank()], ok:false, errs:null, done:null};
function blank(){return {op:'',svc:'',num:'',amt:''};}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return Number(n||0).toLocaleString('fr-FR')+' F';}
function digits(s){return String(s||'').replace(/\D/g,'');}
function total(){return S.lines.reduce(function(a,l){return a+(Number(l.amt)||0);},0);}
function ref(){var a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r='';for(var i=0;i<4;i++)r+=a[Math.floor(Math.random()*a.length)];return 'YR-'+r;}
function b64(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

function validate(){
  var e={lines:[]};var any=false;
  if(S.name.trim().length<2){e.name='Indiquez votre nom.';any=true;}
  if(S.via==='mail'){ if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.contact.trim())){e.contact='Adresse e-mail non valide.';any=true;} }
  else if(digits(S.contact).length<10){e.contact='Le numéro doit contenir 10 chiffres (ex : 07 00 00 00 00).';any=true;}
  S.lines.forEach(function(l,i){
    var le={};
    if(!l.op)le.op='Choisissez le réseau.';
    if(!l.svc)le.svc='Choisissez le service.';
    if(digits(l.num).length!==10)le.num='Le numéro bénéficiaire doit contenir 10 chiffres.';
    if(!(Number(l.amt)>=100))le.amt='Indiquez un montant (minimum 100 F).';
    if(Object.keys(le).length)any=true;
    e.lines[i]=le;
  });
  if(!S.ok){e.ok='Cochez la case pour confirmer votre vérification.';any=true;}
  return any?e:null;
}

function chipRow(items,val,key,i){
  return '<div class="chips">'+items.map(function(it){
    return '<button type="button" class="chip" aria-pressed="'+(val===it.k)+'" data-act="pick" data-k="'+key+'" data-i="'+i+'" data-v="'+it.k+'">'+(it.dot?'<span class="dot" style="background:'+it.dot+'"></span>':'')+esc(it.n)+'</button>';
  }).join('')+'</div>';
}
function lineHtml(l,i){
  var le=(S.errs&&S.errs.lines&&S.errs.lines[i])||{};
  var ops=Object.keys(OPS).map(function(k){return {k:k,n:OPS[k].n,dot:OPS[k].c};});
  var svcs=Object.keys(SVC).map(function(k){return {k:k,n:SVC[k].n};});
  return '<div class="line"><header><b>Recharge '+(i+1)+'</b>'+(S.lines.length>1?'<button type="button" class="link" data-act="del" data-i="'+i+'">Retirer</button>':'')+'</header>'
  +'<div><span class="lab">Réseau</span>'+chipRow(ops,l.op,'op',i)+(le.op?'<p class="err">'+le.op+'</p>':'')+'</div>'
  +'<div><span class="lab">Service</span>'+chipRow(svcs,l.svc,'svc',i)+(le.svc?'<p class="err">'+le.svc+'</p>':'')+'</div>'
  +'<div><label for="num'+i+'">Numéro qui reçoit la recharge</label><input type="tel" id="num'+i+'" inputmode="tel" autocomplete="off" placeholder="07 00 00 00 00" value="'+esc(l.num)+'" data-in="num" data-i="'+i+'">'+(le.num?'<p class="err">'+le.num+'</p>':'')+'</div>'
  +'<div><label for="amt'+i+'">Montant (FCFA)</label><input type="number" id="amt'+i+'" inputmode="numeric" min="100" step="50" placeholder="5000" value="'+esc(l.amt)+'" data-in="amt" data-i="'+i+'">'
  +'<div class="chips" style="margin-top:8px">'+AMTS.map(function(a){return '<button type="button" class="chip" aria-pressed="'+(Number(l.amt)===a)+'" data-act="amt" data-i="'+i+'" data-v="'+a+'">'+a.toLocaleString('fr-FR')+'</button>';}).join('')+'</div>'
  +(le.amt?'<p class="err">'+le.amt+'</p>':'')+'</div></div>';
}

function formHtml(){
  var e=S.errs||{};
  var vias=Object.keys(VIA).map(function(k){return {k:k,n:VIA[k]};});
  var ph=S.via==='mail'?'vous@exemple.com':'07 00 00 00 00';
  var lab=S.via==='mail'?'Votre adresse e-mail':(S.via==='sms'?'Numéro qui recevra le SMS':'Numéro WhatsApp');
  return '<div class="brand"><img src="'+LOGO+'" alt="Yah’Rise Entreprise"><h1>Commander une recharge</h1><p class="lead">Remplissez votre commande. Vous recevrez ensuite un lien de paiement pour le montant exact.</p></div>'
  +'<section class="card"><h2>Vos informations</h2>'
  +'<div><label for="name">Votre nom</label><input type="text" id="name" autocomplete="name" placeholder="Ex : Awa Koné" value="'+esc(S.name)+'" data-in="name">'+(e.name?'<p class="err">'+e.name+'</p>':'')+'</div>'
  +'<div><span class="lab">Recevoir le lien de paiement par</span>'+chipRow(vias,S.via,'via',0)+'</div>'
  +'<div><label for="contact">'+lab+'</label><input type="'+(S.via==='mail'?'email':'tel')+'" id="contact" autocomplete="off" placeholder="'+ph+'" value="'+esc(S.contact)+'" data-in="contact">'+(e.contact?'<p class="err">'+e.contact+'</p>':'')+'</div></section>'
  +S.lines.map(lineHtml).join('')
  +'<button type="button" class="add" data-act="add">+ Ajouter une autre recharge ou un autre numéro</button>'
  +'<section class="card"><h2>Récapitulatif</h2>'
  +'<div class="sum">'+S.lines.map(function(l,i){
      var o=OPS[l.op],s=SVC[l.svc];
      return '<span class="m">'+(i+1)+'. '+(o?o.n:'Réseau ?')+' · '+(s?s.n:'Service ?')+'<br>'+(l.num?esc(l.num):'Numéro ?')+'</span><span class="r">'+(Number(l.amt)?fmt(l.amt):'–')+'</span>';
    }).join('')+'<span class="m">Frais de service ('+FEE_PCT+' %)</span><span class="r">'+fmt(fee())+'</span></div>'
  +'<div class="total"><span>Total à payer</span><b>'+fmt(grand())+'</b></div>'
  +'<label class="check"><input type="checkbox" id="ok" data-in="ok"'+(S.ok?' checked':'')+'><span>J’ai vérifié le <b>numéro</b>, le <b>réseau</b>, le <b>montant</b> et le <b>service</b>. Une erreur de numéro ne peut pas être annulée après l’exécution.</span></label>'
  +(e.ok?'<p class="err">'+e.ok+'</p>':'')
  +'<button type="button" class="btn" data-act="submit">Valider ma commande</button></section>'
  +'<p class="fine">Des frais de service de 1 % sont ajoutés au paiement. Le paiement se fait avant l’exécution de la recharge.</p>';
}

function orderMessage(o){
  var t=o.lines.reduce(function(a,l){return a+l.amt;},0);
  var m='COMMANDE YAH’RISE '+o.ref+'\nClient : '+o.name+'\nLien de paiement par : '+VIA[o.via]+' ('+o.contact+')\n';
  o.lines.forEach(function(l,i){m+=(i+1)+') '+OPS[l.op].n+' · '+SVC[l.svc].n+' · '+l.num+' · '+l.amt.toLocaleString('fr-FR')+' F\n';});
  var f=Math.round(t*FEE_PCT/100);
  m+='Frais de service ('+FEE_PCT+' %) : '+f.toLocaleString('fr-FR')+' F\nTOTAL À PAYER : '+(t+f).toLocaleString('fr-FR')+' F\n';
  var code={f:f,r:o.ref,n:o.name,v:o.via,c:o.contact,t:o.ts,l:o.lines.map(function(l){return [l.op,l.svc,l.num,l.amt];})};
  m+='Code : YR1:'+b64(JSON.stringify(code));
  return m;
}

function doneHtml(){
  var o=S.done,t=o.lines.reduce(function(a,l){return a+l.amt;},0);t=t+Math.round(t*FEE_PCT/100);
  var wa='https://wa.me/'+(WA_NUMBER||'')+'?text='+encodeURIComponent(o.msg);
  return '<div class="brand"><img src="'+LOGO+'" alt="Yah’Rise Entreprise"><h1>Commande prête</h1><p class="lead">Numéro de commande</p><div class="ref">'+esc(o.ref)+'</div></div>'
  +'<section class="card"><h2>Dernière étape : envoyez votre commande</h2>'
  +'<a class="btn" href="'+wa+'" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>'
  +(WA_NUMBER?'':'<p class="fine">WhatsApp va vous demander de choisir le contact Yah’Rise.</p>')
  +'<button type="button" class="btn ghost" data-act="copy">Copier ma commande</button>'
  +'<textarea readonly id="msg" aria-label="Texte de la commande">'+esc(o.msg)+'</textarea></section>'
  +'<section class="card"><h2>Ensuite</h2><ol class="steps">'
  +'<li><span>Yah’Rise reçoit votre commande de <b>'+fmt(t)+'</b>.</span></li>'
  +'<li><span>Vous recevez le lien de paiement par <b>'+VIA[o.via]+'</b> pour le montant exact.</span></li>'
  +'<li><span>Vous payez. <b class="ok">Dès le paiement effectué, vous recevez votre transaction.</b></span></li></ol></section>'
  +'<button type="button" class="btn ghost" data-act="again">Faire une autre commande</button>';
}

var root=document.getElementById('app');
function render(){
  var y=window.scrollY;
  root.innerHTML=S.done?doneHtml():formHtml();
  if(!S.done&&y)window.scrollTo(0,y);
}

root.addEventListener('input',function(ev){
  var t=ev.target,k=t.getAttribute('data-in');if(!k)return;
  var i=+t.getAttribute('data-i');
  if(k==='name')S.name=t.value;
  else if(k==='contact')S.contact=t.value;
  else if(k==='ok'){S.ok=t.checked;}
  else if(k==='num')S.lines[i].num=t.value;
  else if(k==='amt'){S.lines[i].amt=t.value;refreshSummary();}
});
function refreshSummary(){
  var card=root.querySelectorAll('section.card');card=card[card.length-1];if(!card)return;
  var tmp=document.createElement('div');tmp.innerHTML=formHtml();
  var n=tmp.querySelectorAll('section.card');n=n[n.length-1];
  var a=card.querySelector('.sum'),b=n.querySelector('.sum');if(a&&b)a.innerHTML=b.innerHTML;
  var ta=card.querySelector('.total b'),tb=n.querySelector('.total b');if(ta&&tb)ta.textContent=tb.textContent;
}
root.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),i=+b.getAttribute('data-i'),v=b.getAttribute('data-v'),k=b.getAttribute('data-k');
  if(a==='pick'){if(k==='via'){S.via=v;S.contact='';}else S.lines[i][k]=v;render();}
  else if(a==='amt'){S.lines[i].amt=v;render();}
  else if(a==='add'){S.lines.push(blank());render();setTimeout(function(){var el=document.getElementById('num'+(S.lines.length-1));if(el){el.scrollIntoView({block:'center'});}},30);}
  else if(a==='del'){S.lines.splice(i,1);render();}
  else if(a==='submit'){
    S.errs=validate();
    if(S.errs){render();var first=root.querySelector('.err');if(first)first.scrollIntoView({block:'center',behavior:'smooth'});return;}
    var o={ref:ref(),ts:new Date().toISOString(),name:S.name.trim(),via:S.via,contact:S.contact.trim(),lines:S.lines.map(function(l){return {op:l.op,svc:l.svc,num:digits(l.num),amt:Number(l.amt)};})};
    o.msg=orderMessage(o);S.done=o;render();window.scrollTo(0,0);
  }
  else if(a==='copy'){
    var ta=document.getElementById('msg');var done=function(){b.textContent='Commande copiée';};
    try{navigator.clipboard.writeText(S.done.msg).then(done,function(){ta.select();});}catch(e){ta.select();}
  }
  else if(a==='again'){S={name:S.done.name,via:S.done.via,contact:S.done.contact,lines:[blank()],ok:false,errs:null,done:null};render();window.scrollTo(0,0);}
});
render();
})();
</script>
